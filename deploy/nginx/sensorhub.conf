# /etc/nginx/sites-available/sensorhub
# Replace serre.example.it with the real domain. Certificates are created by certbot (see deploy/README.md).

upstream sensorhub_api {
    server unix:/run/sensorhub/sensorhub.sock;
}

# HTTP: only the redirect to HTTPS (and the certbot challenge)
server {
    listen 80;
    listen [::]:80;
    server_name serre.example.it;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name serre.example.it;

    ssl_certificate     /etc/letsencrypt/live/serre.example.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serre.example.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # React build (npm run build -> dist/)
    root /var/www/sensorhub;
    index index.html;

    # Files with a hash in the name never change: cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths return index.html (react-router)
    location / {
        try_files $uri /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://sensorhub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Server-Sent Events: no buffering, long-lived connection
    location /api/stream {
        proxy_pass http://sensorhub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
