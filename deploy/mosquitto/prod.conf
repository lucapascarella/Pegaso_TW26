# /etc/mosquitto/conf.d/sensorhub.conf
# Production broker: authentication, ACL, TLS for the devices.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Backend on the same server: loopback only, no TLS needed
listener 1883 127.0.0.1

# Devices from the Internet: TLS only
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile  /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2

# Retained configurations and persistent sessions survive a broker restart
persistence true
persistence_location /var/lib/mosquitto/
